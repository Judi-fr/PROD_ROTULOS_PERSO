# Despliegue de ROTULOS_PERSO en un servidor.
#
# A mano: `docker compose -f docker-compose.prod.yml up -d`.
# Automático: azure-pipelines-deploy.yml + scripts/deploy.sh (preparado el
# 2026-11-04, sin servidor todavía; ver docs/despliegue.md).
#
# Diferencias con backend/docker-compose.yml (que es el de desarrollo):
#   - settings de prod (DEBUG=False, hosts explícitos, cookies seguras)
#   - gunicorn en vez de runserver, sin el código montado como volumen
#   - el frontend y Caddy, que en desarrollo no hacen falta
#   - la base NO expone el puerto al exterior
#
# Antes de levantar hace falta un .env en esta carpeta: copiarlo de
# .env.prod.example, que lista todas las variables y cómo generar cada secreto.

name: rotulos-perso-prod

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rotulos}
      POSTGRES_USER: ${POSTGRES_USER:-rotulos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin `ports`: a diferencia del compose de desarrollo, la base NO se
    # expone al exterior. Se llega a ella por la red interna de Compose.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rotulos} -d ${POSTGRES_DB:-rotulos}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    # Etiqueta por versión: el despliegue automático (scripts/deploy.sh) la
    # fija con el commit y así un rollback tiene la imagen anterior a mano. A
    # mano queda "local".
    image: rotulos-api:${RELEASE_TAG:-local}
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-rotulos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rotulos}
      # Un objeto JSON por línea (config/log_format.py), para un recolector de
      # logs. `LOG_FORMAT=text` en el .env vuelve al formato legible a ojo.
      LOG_FORMAT: ${LOG_FORMAT:-json}
    # Migraciones, estáticos y las miniaturas que falten (idempotente: si ya
    # están todas no hace nada) antes de atender: si la imagen es nueva pero la
    # base quedó en la versión anterior, la app arranca rota. Esto vale con UN
    # solo contenedor de API; con varias réplicas, las migraciones pasan a ser
    # un paso aparte para que no corran en paralelo.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py collectstatic --noinput &&
             python manage.py generate_template_thumbnails &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # La sonda que consulta la base (ver config/health.py): si Postgres se
      # cae, este contenedor se marca unhealthy en vez de seguir figurando
      # como sano mientras devuelve errores.
      # La cabecera X-Forwarded-Proto no es adorno: prod.py fuerza HTTPS
      # (SECURE_SSL_REDIRECT), y esta consulta va por HTTP plano contra el
      # propio contenedor. Sin la cabecera, Django contesta 301 y el
      # contenedor quedaría marcado como caído estando perfecto.
      # El Host es el DOMINIO, no 127.0.0.1: ALLOWED_HOSTS solo tiene el
      # dominio real, y con otro Host Django contesta 400 (DisallowedHost).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready/', headers={'X-Forwarded-Proto':'https','Host':'${DOMINIO}'}); sys.exit(0 if urllib.request.urlopen(r, timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Sin este proceso las tiendas no sincronizan solas: los webhooks encolan
  # IntegrationEvent y es el worker quien los procesa (ver CLAUDE.md).
  worker:
    build: ./backend
    image: rotulos-api:${RELEASE_TAG:-local}
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-rotulos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rotulos}
      # Un objeto JSON por línea (config/log_format.py), para un recolector de
      # logs. `LOG_FORMAT=text` en el .env vuelve al formato legible a ojo.
      LOG_FORMAT: ${LOG_FORMAT:-json}
    command: python manage.py run_integrations_worker
    volumes:
      - media:/app/media
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # Las alertas de disponibilidad por mail (apps.monitoring): chequea cada
  # minuto y avisa a los admins cuando algo pasa a "falla". Va aparte del
  # worker porque lo primero que tiene que poder avisar es que el worker se
  # cayó; si el que se cae es este, el worker toma su lugar.
  # Para que los mails salgan hace falta EMAIL_HOST (y usuario/clave) en el
  # .env; MONITORING_ALERT_EMAILS para avisar a otras direcciones.
  monitor:
    build: ./backend
    image: rotulos-api:${RELEASE_TAG:-local}
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-rotulos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rotulos}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    command: python manage.py run_monitor
    volumes:
      # Solo para medir el espacio libre del disco de los PDF generados.
      - media:/app/media:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    image: rotulos-web:${RELEASE_TAG:-local}
    environment:
      # Lo que termina dentro de config.js al arrancar el contenedor.
      API_BASE: https://${DOMINIO:?definir DOMINIO en .env}/api/v1
    restart: unless-stopped

  caddy:
    image: docker.io/library/caddy:2-alpine
    environment:
      DOMINIO: ${DOMINIO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Los mismos volúmenes que la API, en solo lectura: Caddy los sirve,
      # Django los escribe.
      - media:/srv/media:ro
      - static:/srv/static:ro
      # Los certificados: sin esto Caddy vuelve a pedirlos en cada reinicio y
      # Let's Encrypt tiene límite de emisiones.
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped
    depends_on:
      - api
      - web

  # Backup diario de la base y de media (ver backup/backup.sh y HELP_ME.md).
  # Las copias quedan en ./backups, una carpeta del servidor y NO un volumen:
  # `docker compose down -v` borra los volúmenes, y se llevaría los datos y
  # sus backups juntos.
  backup:
    build: ./backup
    environment: &backup_env
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-rotulos}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-rotulos}
      TZ: ${BACKUP_TZ:-America/Argentina/Buenos_Aires}
      BACKUP_HOUR: ${BACKUP_HOUR:-03:00}
      BACKUP_KEEP_LOCAL: ${BACKUP_KEEP_LOCAL:-7}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-1}
      # Copia externa cifrada (opcional): vacío = solo copia local.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    # Solo lo que necesita, no el .env entero: este contenedor no tiene por
    # qué ver SECRET_KEY ni las credenciales de Tiendanube.
    volumes:
      - media:/media:ro
      - ./backups:/backups
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Sano = hubo un backup completo (local y, si está configurada, la
      # copia externa) en las últimas 26 horas.
      test: ["CMD-SHELL", "test -f /backups/.ultimo-ok && [ $$(( $$(date +%s) - $$(cat /backups/.ultimo-ok) )) -lt 93600 ]"]
      interval: 5m
      timeout: 10s
      start_period: 10m

  # Restauración: NO arranca con `up` (profile). Se usa a mano, con la API y
  # el worker frenados:  docker compose -f docker-compose.prod.yml run --rm restore
  # Es aparte del backup porque necesita escribir en media, y el servicio que
  # corre todos los días no tiene por qué poder hacerlo.
  restore:
    build: ./backup
    profiles: ["restore"]
    entrypoint: ["restore.sh"]
    environment: *backup_env
    volumes:
      - media:/media
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  static:
  caddydata:
  caddyconfig:
