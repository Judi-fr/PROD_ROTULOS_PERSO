<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Todos los pedidos</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
    <meta name="theme-color" content="#308028" />
    <link rel="stylesheet" href="assets/css/ui.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/gestionuser.css" />
  </head>
  <body>
    <div class="layout">
      <!-- La barra compartida (assets/js/topbar.js): avisos y cuenta; la navegación es la
           barra lateral (app_sidebar.js), la misma de todas las páginas. -->
      <header class="topbar" id="appTopbar"></header>

      <!-- MAIN -->
      <main class="main">
        <div class="page-head">
          <div>
            <h1 id="adminOrdersTitle">Todos los pedidos</h1>
            <p>Los pedidos de todos los comercios de la plataforma.</p>
          </div>
        </div>

        <section aria-labelledby="adminOrdersTitle">
          <div class="roles-card">
            <div class="roles-card-title">Filtros</div>
            <div class="filter-bar">
              <input type="text" id="adminOrdersSearchInput" placeholder="Buscar por email o descripción..." />
              <select id="adminOrdersStatusFilter">
                <option value="">Todos los estados</option>
              </select>
              <label>Desde <input type="date" id="adminOrdersDateFrom" /></label>
              <label>Hasta <input type="date" id="adminOrdersDateTo" /></label>
              <button type="button" class="btn btn-outline" id="applyAdminOrdersFiltersBtn">Aplicar</button>
              <button type="button" class="btn btn-outline" id="clearAdminOrdersFiltersBtn">Limpiar</button>
            </div>
          </div>

          <div class="roles-card">
            <div class="roles-card-title">Pedidos</div>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th style="width: 18%">Usuario</th>
                    <th style="width: 30%">Descripción</th>
                    <th style="width: 12%">Estado</th>
                    <th style="width: 20%">Último evento</th>
                    <th style="width: 20%">Creado</th>
                  </tr>
                </thead>
                <tbody id="adminOrdersBody">
                  <tr><td colspan="5" class="table-placeholder"><span class="app-skeleton" role="status" aria-label="Cargando…"><span></span><span></span><span></span></span></td></tr>
                </tbody>
              </table>
            </div>
            <div class="pagination-bar">
              <div class="showing" id="adminOrdersPaginationInfo">Mostrando 0 pedidos</div>
              <div class="pager" id="adminOrdersPaginationControls"></div>
            </div>
          </div>
        </section>
      </main>

      <script src="assets/js/config.js"></script>
      <script src="assets/js/auth.js"></script>
      <script src="assets/js/utils.js"></script>
      <script src="assets/js/admin_common.js"></script>
      <script src="assets/js/topbar.js"></script>
      <script src="assets/js/pedidos_admin.js"></script>
    </div>
  </body>
</html>
