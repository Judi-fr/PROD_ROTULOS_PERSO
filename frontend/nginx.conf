# Sitio estático del frontend. No hay build ni framework: son los .html tal
# cual, así que esto solo sirve archivos.

# Cache-Control según la dirección. Va en un map, y no en un add_header por
# location, porque en nginx un add_header dentro de una location anula TODOS
# los del server: los encabezados de seguridad de abajo se perderían justo en
# las páginas. Un valor vacío no manda el encabezado.
map $uri $cache_control {
    default "";
    # config.js se genera al arrancar el contenedor con la URL real de la API
    # (ver docker-entrypoint.sh). Si se cachea, un navegador que ya lo tiene
    # sigue apuntando a la API vieja después de mover el backend.
    /assets/js/config.js "no-store";
    # La raíz (inicio.html) y las páginas se revalidan siempre: son las que
    # traen el ?v= de cada CSS/JS (tools/version_assets.sh); una página vieja
    # en caché seguiría pidiendo los archivos viejos. 404.html también.
    / "no-cache";
    ~\.html$ "no-cache";
    # El resto de los assets sí se cachean: los CSS/JS llevan ?v=<hash de su
    # contenido>, así que uno que cambió tiene otra URL.
    ~^/assets/ "public";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, una tilde en un .html se ve rota: los archivos están en UTF-8
    # y nginx anuncia latin-1 por defecto.
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $cache_control always;

    # Los mismos encabezados que pone el Caddyfile. Van también acá porque en
    # producción (AWS) el frontend sale directo de este nginx, sin Caddy
    # adelante. Solo el frontend: la vista previa de impresión de Shopify
    # carga nuestro PDF de /api/ dentro de un frame, y eso no pasa por acá.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ninguna location lleva su propio add_header (ver el map de arriba).
    # config.js va aparte para quedar afuera del `expires` de /assets/.
    location = /assets/js/config.js {
    }

    location /assets/ {
        expires 1h;
    }

    # La raíz del dominio es la página de presentación; el login sigue en
    # /index.html (adonde manda la app a quien no tiene sesión).
    location = / {
        try_files /inicio.html =404;
    }

    # Una dirección que no existe muestra la página de error de la app (con la
    # marca y cómo volver) en vez de la de nginx. Sigue respondiendo 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        # Nada de fallback a index.html: esto es multi-página, un .html que no
        # existe TIENE que dar 404 y no la pantalla de login disfrazada.
        try_files $uri $uri/ =404;
    }
}
